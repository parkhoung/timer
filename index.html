<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>쌀먹 타이머</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-20: #3b82f6;
      --accent-30: #8b5cf6;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --danger: #ef4444;
      --success: #22c55e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    h1 {
      text-align: center;
      font-size: 2rem;
      font-weight: 800;
      color: var(--text-main);
      letter-spacing: -0.025em;
    }

    .timer-card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 28px 24px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      transition: transform 0.2s ease, border-color 0.2s ease;
      border: 2px solid transparent;
    }

    .timer-card.card-20 {
      border-color: rgba(59, 130, 246, 0.3);
    }

    .timer-card.card-30 {
      border-color: rgba(139, 92, 246, 0.3);
    }

    .timer-card.alarm-active {
      animation: pulse-danger 1s infinite alternate;
      border-color: var(--danger);
    }

    @keyframes pulse-danger {
      0% {
        box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4);
      }
      100% {
        box-shadow: 0 0 20px 10px rgba(239, 68, 68, 0.2);
      }
    }

    .timer-title {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .card-20 .timer-title { color: var(--accent-20); }
    .card-30 .timer-title { color: var(--accent-30); }

    .time-display {
      font-size: 3.5rem;
      font-weight: 800;
      font-mono: monospace;
      letter-spacing: -0.05em;
      margin-bottom: 20px;
    }

    .btn-group {
      display: flex;
      gap: 12px;
      width: 100%;
    }

    button {
      flex: 1;
      padding: 14px 0;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s ease, transform 0.1s ease;
      color: #fff;
    }

    button:active {
      transform: scale(0.98);
    }

    .btn-start-20 { background-color: var(--accent-20); }
    .btn-start-30 { background-color: var(--accent-30); }
    .btn-danger { background-color: var(--danger); }
    .btn-secondary { background-color: #475569; }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🌾 쌀먹 타이머</h1>

    <!-- 20분 타이머 (상단) -->
    <div class="timer-card card-20" id="card-20">
      <div class="timer-title">20분 타이머</div>
      <div class="time-display" id="display-20">20:00</div>
      <div class="btn-group">
        <button class="btn-start-20" id="btn-start-20" onclick="startTimer(20)">시작</button>
        <button class="btn-secondary" id="btn-stop-20" onclick="stopTimer(20)" disabled>사용종료</button>
      </div>
    </div>

    <!-- 30분 타이머 (하단) -->
    <div class="timer-card card-30" id="card-30">
      <div class="timer-title">30분 타이머</div>
      <div class="time-display" id="display-30">30:00</div>
      <div class="btn-group">
        <button class="btn-start-30" id="btn-start-30" onclick="startTimer(30)">시작</button>
        <button class="btn-secondary" id="btn-stop-30" onclick="stopTimer(30)" disabled>사용종료</button>
      </div>
    </div>
  </div>

  <script>
    // 타이머 상태 관리 객체
    const timers = {
      20: {
        totalSeconds: 20 * 60,
        remainingSeconds: 20 * 60,
        intervalId: null,
        alarmIntervalId: null,
        audioCtx: null
      },
      30: {
        totalSeconds: 30 * 60,
        remainingSeconds: 30 * 60,
        intervalId: null,
        alarmIntervalId: null,
        audioCtx: null
      }
    };

    // 시간 포맷팅 (초 -> MM:SS)
    function formatTime(seconds) {
      const m = Math.floor(seconds / 60).toString().padStart(2, '0');
      const s = (seconds % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    // 타이머 시작
    function startTimer(minutes) {
      const timer = timers[minutes];
      if (timer.intervalId || timer.alarmIntervalId) return;

      // Web Audio API Context 생성 (사용자 상호작용 필요)
      if (!timer.audioCtx) {
        timer.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      } else if (timer.audioCtx.state === 'suspended') {
        timer.audioCtx.resume();
      }

      document.getElementById(`btn-start-${minutes}`).disabled = true;
      document.getElementById(`btn-stop-${minutes}`).disabled = false;

      timer.intervalId = setInterval(() => {
        timer.remainingSeconds--;
        document.getElementById(`display-${minutes}`).textContent = formatTime(timer.remainingSeconds);

        if (timer.remainingSeconds <= 0) {
          clearInterval(timer.intervalId);
          timer.intervalId = null;
          triggerAlarm(minutes);
        }
      }, 1000);
    }

    // 비프음 재생 (Web Audio API)
    function playBeep(audioCtx) {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(880, audioCtx.currentTime); // A5 음높이 (880Hz)
      gain.gain.setValueAtTime(0.15, audioCtx.currentTime);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start();
      osc.stop(audioCtx.currentTime + 0.2); // 0.2초 간 삐빅 sound
    }

    // 시간 초과 시 알람 발생
    function triggerAlarm(minutes) {
      const timer = timers[minutes];
      const card = document.getElementById(`card-${minutes}`);
      const stopBtn = document.getElementById(`btn-stop-${minutes}`);

      card.classList.add('alarm-active');
      stopBtn.classList.remove('btn-secondary');
      stopBtn.classList.add('btn-danger');

      // 삐빅 소리 반복 (0.5초 주기)
      playBeep(timer.audioCtx);
      timer.alarmIntervalId = setInterval(() => {
        playBeep(timer.audioCtx);
      }, 500);
    }

    // 사용종료 (알람 멈춤 및 초기화)
    function stopTimer(minutes) {
      const timer = timers[minutes];

      // 타이머 인터벌 해제
      if (timer.intervalId) {
        clearInterval(timer.intervalId);
        timer.intervalId = null;
      }

      // 알람 인터벌 해제
      if (timer.alarmIntervalId) {
        clearInterval(timer.alarmIntervalId);
        timer.alarmIntervalId = null;
      }

      // 상태 및 UI 초기화
      timer.remainingSeconds = timer.totalSeconds;
      document.getElementById(`display-${minutes}`).textContent = formatTime(timer.totalSeconds);

      const card = document.getElementById(`card-${minutes}`);
      card.classList.remove('alarm-active');

      const stopBtn = document.getElementById(`btn-stop-${minutes}`);
      stopBtn.classList.remove('btn-danger');
      stopBtn.classList.add('btn-secondary');
      stopBtn.disabled = true;

      document.getElementById(`btn-start-${minutes}`).disabled = false;
    }
  </script>
</body>
</html>
